<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chi tiết tổ chức – khu vực Workspace phòng, chống ma túy tại Thành phố Hồ Chí Minh">
    <meta name="robots" content="noindex, nofollow">
    <title>CHI TIẾT CƠ QUAN, ĐƠN VỊ | CHUYÊN TRANG ĐIỆN TỬ VỀ PHÒNG, CHỐNG MA TÚY TẠI THÀNH PHỐ HỒ CHÍ MINH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="../../assets/icons/logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/workspace.css">

    <script src="../../js/main.js" defer></script>
    <script src="../../js/api.js" defer></script>
    <script src="../../js/workspace.js" defer></script>
</head>

<body class="ws-body">
    <div class="ws-app">
        <aside class="ws-sidebar" id="ws-sidebar" aria-label="Điều hướng Workspace"></aside>

        <div class="ws-shell">
            <header class="ws-header">
                <button type="button" class="ws-header__toggle" id="ws-menu-toggle" aria-label="Mở menu điều hướng"
                    aria-expanded="false" aria-controls="ws-sidebar">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <div class="ws-header__left">
                    <nav aria-label="Đường dẫn">
                        <ol class="ws-breadcrumb" id="ws-breadcrumb"></ol>
                    </nav>
                    <p class="ws-header__title" id="ws-page-title">Chi tiết tổ chức</p>
                </div>
                <div class="ws-header__right">
                    <form class="ws-header__search" id="ws-search" role="search">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" name="q" placeholder="Tìm nhiệm vụ…" aria-label="Tìm kiếm nhanh">
                    </form>
                    <span id="ws-notifications"></span>
                    <span id="ws-user-host"></span>
                </div>
            </header>

            <main class="ws-main">
                <div class="ws-main__inner" id="ws-org-detail">
                    <div class="ws-page-head" id="ws-org-head"></div>

                    <div class="ws-tabs" data-tabs="org" role="tablist" aria-label="Nội dung chi tiết tổ chức">
                        <button type="button" class="ws-tab" data-tab="overview" role="tab">
                            <i class="fa-solid fa-circle-info" aria-hidden="true"></i> Tổng quan
                        </button>
                        <button type="button" class="ws-tab" data-tab="staff" role="tab">
                            <i class="fa-solid fa-users" aria-hidden="true"></i> Nhân sự
                        </button>
                        <button type="button" class="ws-tab" data-tab="tasks" role="tab">
                            <i class="fa-solid fa-list-check" aria-hidden="true"></i> Nhiệm vụ
                        </button>
                        <button type="button" class="ws-tab" data-tab="reports" role="tab">
                            <i class="fa-solid fa-file-lines" aria-hidden="true"></i> Báo cáo
                        </button>
                        <button type="button" class="ws-tab" data-tab="docs" role="tab">
                            <i class="fa-solid fa-folder-open" aria-hidden="true"></i> Tài liệu
                        </button>
                        <button type="button" class="ws-tab" data-tab="events" role="tab">
                            <i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Lịch hoạt động
                        </button>
                        <button type="button" class="ws-tab" data-tab="history" role="tab">
                            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Lịch sử cập nhật
                        </button>
                    </div>

                    <div class="ws-card ws-card--spaced">
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="overview" role="tabpanel">
                            <div id="ws-org-overview"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="staff" role="tabpanel" hidden>
                            <div id="ws-org-staff"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="tasks" role="tabpanel" hidden>
                            <div id="ws-org-tasks"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="reports" role="tabpanel" hidden>
                            <div id="ws-org-reports"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="docs" role="tabpanel" hidden>
                            <div id="ws-org-docs"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="events" role="tabpanel" hidden>
                            <div id="ws-org-events"></div>
                        </div>
                        <div class="ws-card__body" data-tab-panel="org" data-tab-name="history" role="tabpanel" hidden>
                            <div id="ws-org-history"></div>
                        </div>
                    </div>

                    <footer class="ws-main__footer">
                        <div class="ws-main__footer-inner">
                            <p>© <span class="ws-year">2026</span> Chuyên trang điện tử về phòng, chống ma túy
                                Thành phố Hồ Chí Minh.</p>
                            
                        </div>
                    </footer>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
