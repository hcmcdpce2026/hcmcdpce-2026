<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>NỘI DUNG CÔNG KHAI | CỔNG THÔNG TIN ĐIỆN TỬ VỀ PHÒNG, CHỐNG MA TÚY TẠI THÀNH PHỐ HỒ CHÍ MINH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/cms.css">
    <script src="../../js/main.js" defer></script>
    <script src="../../js/api.js" defer></script>
    <script src="../../js/cms.js" defer></script>
</head>
<body class="cms-body">
    <div class="cms-app">
        <aside class="cms-sidebar" id="cms-sidebar" aria-label="Điều hướng quản trị"></aside>
        <div class="cms-shell">
            <header class="cms-header">
                <button type="button" class="cms-header__toggle" id="cms-menu-toggle" aria-label="Mở menu điều hướng" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="cms-header__left">
                    <nav aria-label="Đường dẫn"><ol class="cms-breadcrumb" id="cms-breadcrumb"></ol></nav>
                    <p class="cms-header__title" id="cms-page-title">Nội dung công khai</p>
                </div>
                <div class="cms-header__right">
                    <span id="cms-notifications"></span>
                    <span id="cms-user-host"></span>
                </div>
            </header>
            <main class="cms-main" id="cms-main">
                <div class="cms-main__inner">
                    <div class="cms-page-head">
                        <div class="cms-page-head__text">
                            <h1 class="cms-page-head__title">Nội dung công khai</h1>
                            <p class="cms-page-head__desc">Nhập và chỉnh sửa văn bản, cơ quan, sự kiện, cơ sở hỗ trợ và số liệu hiển thị trên Cổng thông tin.</p>
                        </div>
                    </div>
                    <div class="cms-tabs" id="public-catalog-tabs">
                        <button type="button" class="cms-tab is-active" data-kind="legal-documents">Văn bản pháp luật</button>
                        <button type="button" class="cms-tab" data-kind="agencies">Cơ quan - Đơn vị</button>
                        <button type="button" class="cms-tab" data-kind="events">Sự kiện</button>
                        <button type="button" class="cms-tab" data-kind="support-facilities">Cơ sở hỗ trợ</button>
                        <button type="button" class="cms-tab" data-kind="statistics">Số liệu thống kê</button>
                    </div>
                    <section class="cms-card cms-u-mt-lg">
                        <div class="cms-card__head">
                            <h2 class="cms-card__title" id="public-catalog-title">Văn bản pháp luật</h2>
                            <button type="button" class="cms-btn cms-btn--primary" id="public-catalog-create">
                                <i class="fa-solid fa-plus"></i> Thêm mới
                            </button>
                        </div>
                        <div class="cms-card__body" id="public-catalog-content">
                            <div class="cms-state">Đang tải dữ liệu…</div>
                        </div>
                    </section>
                    <footer class="cms-main__footer">
                        <div class="cms-main__footer-inner">
                            <p>© <span class="cms-year">2026</span> Cổng thông tin điện tử về phòng, chống ma túy tại Thành phố Hồ Chí Minh.</p>
                        </div>
                    </footer>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
