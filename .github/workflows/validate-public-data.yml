name: Validate public snapshot

on:
  push:
    branches: [main]
    paths:
      - 'public-data/**'
      - 'server/scripts/check-static-public.js'
      - 'package.json'
      - '.github/workflows/validate-public-data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public-data/**'
      - 'server/scripts/check-static-public.js'
      - 'package.json'
      - '.github/workflows/validate-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate snapshot and tracked media
        run: npm run check:static-public:git
