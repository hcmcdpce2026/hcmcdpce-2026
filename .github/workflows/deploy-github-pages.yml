name: Deploy public data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'pages/public/**'
      - 'public-data/**'
      - 'server/scripts/prepare-github-pages.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public snapshot
        run: npm run check:static-public
      - name: Prepare public-only Pages artifact
        run: npm run prepare:github-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
